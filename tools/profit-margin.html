<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profit Margin Calculator | Smart Tools</title>

    <meta name="description"
          content="حاسبة مجانية لحساب الربح وهامش الربح ونسبة الربح.">

    <link rel="stylesheet" href="../style.css">

</head>

<body>


<header>

    <h1>🛠️ Smart Tools</h1>

    <p>أدوات ذكية ومجانية للجميع</p>

</header>


<section class="hero">

    <h2>📈 حاسبة هامش الربح</h2>

    <p>
        احسب الربح ونسبة الربح وهامش الربح من سعر البيع والتكلفة.
    </p>

</section>


<section class="tools">

    <div class="tools-title">

        <h2>أدخل بيانات المنتج</h2>

        <p>
            أدخل تكلفة المنتج وسعر البيع
        </p>

    </div>


    <div class="card">

        <input
            type="number"
            id="cost"
            placeholder="تكلفة المنتج"
            min="0"
            step="0.01">


        <input
            type="number"
            id="sellingPrice"
            placeholder="سعر البيع"
            min="0"
            step="0.01">


        <button onclick="calculateMargin()">
            📊 احسب الربح
        </button>


        <div
            class="result"
            id="marginResult">

            أدخل البيانات ثم اضغط احسب

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 Smart Tools
    </p>

    <p>
        أدوات رقمية مجانية وسريعة
    </p>

</footer>


<script>

function calculateMargin() {

    const cost =
        parseFloat(
            document.getElementById("cost").value
        );

    const sellingPrice =
        parseFloat(
            document.getElementById("sellingPrice").value
        );


    if (
        isNaN(cost) ||
        isNaN(sellingPrice)
    ) {

        document.getElementById("marginResult").innerText =
            "⚠️ أدخل التكلفة وسعر البيع.";

        return;

    }


    if (
        cost < 0 ||
        sellingPrice < 0
    ) {

        document.getElementById("marginResult").innerText =
            "⚠️ أدخل أرقامًا صحيحة.";

        return;

    }


    if (sellingPrice === 0) {

        document.getElementById("marginResult").innerText =
            "⚠️ سعر البيع يجب أن يكون أكبر من صفر.";

        return;

    }


    const profit =
        sellingPrice - cost;


    const profitRate =
        (profit / cost) * 100;


    const margin =
        (profit / sellingPrice) * 100;


    let profitRateText;


    if (cost === 0) {

        profitRateText = "غير محدد";

    } else {

        profitRateText =
            profitRate.toFixed(2) + "%";

    }


    document.getElementById("marginResult").innerHTML =

        "التكلفة: " +
        cost.toFixed(2) +

        "<br>سعر البيع: " +
        sellingPrice.toFixed(2) +

        "<br>الربح: " +
        profit.toFixed(2) +

        "<br>نسبة الربح على التكلفة: " +
        profitRateText +

        "<br>هامش الربح: " +
        margin.toFixed(2) +
        "%";

}

</script>


</body>

</html>
